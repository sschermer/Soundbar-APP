name: Tonmaschine Audiosignal-Diagnose (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/signal_diagnose.py'
      - 'tools/test_signal_diagnose.py'
      - 'tools/SIGNALDIAGNOSE_ANLEITUNG.txt'
      - '.github/workflows/signal-diagnose.yml'

permissions:
  contents: read

jobs:
  build:
    name: Standalone Windows-Diagnose
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: 'x64'

      - name: Abhaengigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install 'lg-bartalk==0.1.3' 'pycryptodome==3.24.1' 'pyinstaller==6.22.3'

      - name: Tests und Syntax pruefen
        shell: pwsh
        run: |
          python -m py_compile tools/signal_diagnose.py
          python -m unittest discover -s tools -p 'test_signal_diagnose.py' -v

      - name: Portable Diagnose-EXE bauen
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Tonmaschine_Signaldiagnose --icon Tonmaschine.ico `
            --collect-all lg_bartalk tools/signal_diagnose.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller fehlgeschlagen: $LASTEXITCODE" }
          if (-not (Test-Path 'dist/Tonmaschine_Signaldiagnose.exe')) { throw 'Diagnose-EXE fehlt' }

      - name: Portable Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Tonmaschine_Signaldiagnose_Windows
          path: |
            dist/Tonmaschine_Signaldiagnose.exe
            tools/SIGNALDIAGNOSE_ANLEITUNG.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
            third_party_licenses/
          if-no-files-found: error
          retention-days: 30