name: Windows-Installer (Tonmaschine)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tonmaschine.py'
      - 'Tonmaschine.iss'
      - 'Tonmaschine.ico'
      - 'requirements.txt'
      - 'requirements-build.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - 'third_party_licenses/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows Setup (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Abhaengigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip install -r requirements-dev.txt
          python -m pip freeze --all | Set-Content -Path BUILD_DEPENDENCIES.txt -Encoding utf8
          python --version | Add-Content -Path BUILD_DEPENDENCIES.txt -Encoding utf8

      - name: Automatisierte Tests
        shell: pwsh
        run: python -m pytest -q tests

      - name: Drittanbieter-Lizenztexte pruefen
        shell: pwsh
        run: |
          $required = @(
            'third_party_licenses/lg-bartalk_APACHE-2.0.txt',
            'third_party_licenses/lg-bartalk_NOTICE.txt',
            'third_party_licenses/customtkinter_MIT.txt',
            'third_party_licenses/pycryptodome_LICENSE.rst',
            'third_party_licenses/darkdetect_BSD-3-Clause.txt',
            'third_party_licenses/packaging_LICENSE.BSD.txt',
            'third_party_licenses/packaging_LICENSE.APACHE.txt',
            'third_party_licenses/Roboto_APACHE-2.0.txt',
            'third_party_licenses/python-3.12.10_LICENSE.txt',
            'third_party_licenses/Tcl_8.6_license.terms',
            'third_party_licenses/Tk_8.6_license.terms',
            'third_party_licenses/pyinstaller_6.22.3_COPYING.txt',
            'third_party_licenses/inno-setup_LICENSE.txt'
          )
          $required += @('LICENSE','THIRD_PARTY_NOTICES.md')
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Lizenzdatei fehlt: $path" }
            if ((Get-Item -LiteralPath $path).Length -lt 100) { throw "Lizenzdatei unvollstaendig: $path" }
          }
          Write-Host "Lizenzdateien geprueft: $($required.Count)"

      - name: Python-Syntax pruefen
        shell: pwsh
        run: python -m py_compile Tonmaschine.py

      - name: Programm als Windows-EXE bauen
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Tonmaschine --icon Tonmaschine.ico `
            --collect-all customtkinter --collect-all lg_bartalk Tonmaschine.py
          if (-not (Test-Path 'dist/Tonmaschine.exe')) { throw 'Programm-EXE fehlt' }

      - name: Inno Setup Compiler finden
        id: inno
        shell: pwsh
        run: |
          $locations = @(
            (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $locations | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            $compiler = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
          }
          if (-not $compiler) { throw 'Inno Setup konnte nicht gefunden werden' }
          "iscc=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Windows-Installationsdatei bauen
        shell: pwsh
        run: |
          & '${{ steps.inno.outputs.iscc }}' /Qp 'Tonmaschine.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen: $LASTEXITCODE" }
          if (-not (Test-Path 'Installer/Tonmaschine_Setup.exe')) { throw 'Setup-EXE fehlt' }

      - name: Windows-Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Tonmaschine-v1.0.1-Windows-Setup
          path: Installer/Tonmaschine_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Lizenzarchiv und SHA256-Pruefsumme erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path 'LICENSE','THIRD_PARTY_NOTICES.md','third_party_licenses' -DestinationPath 'Third_Party_Licenses.zip' -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path 'Installer/Tonmaschine_Setup.exe').Hash.ToLowerInvariant()
          "$hash  Tonmaschine_Setup.exe" | Set-Content -Path SHA256SUMS.txt -Encoding utf8

      - name: Offizielles Korrektur-Release v1.0.1 erstellen
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.1 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release v1.0.1 existiert bereits; kein Ueberschreiben.'
            exit 0
          }
          @'
          ## Tonmaschine v1.0.1

          Korrektur-Release von Tonmaschine fuer Windows.

          - Vollstaendige Drittanbieter-Lizenztexte und Copyright-Hinweise im Installer
          - Gesondertes Archiv Third_Party_Licenses.zip mit den Originaltexten
          - Fixierte Paketversionen und dokumentierte Build-Abhaengigkeiten
          - Keine Aenderungen an den Programmfunktionen gegenueber v1.0.0

          Tonmaschine steuert die LG S95QR lokal im Netzwerk und erlaubt das Speichern
          und Laden von Klangprofilen auf dem PC oder NAS.

          Die Installation, Soundbar-Verbindung und Profilverwaltung wurden fuer
          v1.0.0 unter Windows praktisch getestet. v1.0.1 wird neu gebaut und
          automatisch getestet, ein erneuter Geraetetest steht noch aus.

          **Hinweis:** Unabhaengiges, nichtkommerzielles Projekt ohne Verbindung zu
          LG Electronics. Kein offiziell unterstuetztes LG-Produkt.
          Der Installer ist nicht digital signiert (SmartScreen-Hinweis moeglich).
          Die Nutzung erfolgt ohne Gewaehr im gesetzlich zulaessigen Umfang.
          '@ | Set-Content -Path RELEASE_NOTES.md -Encoding utf8
          gh release create v1.0.1 'Installer/Tonmaschine_Setup.exe' 'LICENSE' 'THIRD_PARTY_NOTICES.md' 'Third_Party_Licenses.zip' 'BUILD_DEPENDENCIES.txt' 'SHA256SUMS.txt' --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Tonmaschine v1.0.1' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release konnte nicht erstellt werden: $LASTEXITCODE" }
